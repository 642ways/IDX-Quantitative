# Only needed to deploy from the command line with `npx wrangler deploy` in this folder.
# Setting it up in the Cloudflare dashboard instead works the same; see the README.
name = "idx-quant-cron"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
# Cloudflare cron times are in UTC: every 5 minutes from 09:00 to 12:55 UTC is 16:00 to 19:55 WIB,
# Monday to Friday. The Worker itself decides whether the day's prices are ready.
crons = ["*/5 9-12 * * 1-5"]

[observability]
enabled = true
